name: Deploy

# Cloudflare Workers: DISABLED by default. The jobs run only when the repository variable DEPLOY_ENABLED is 'true'
# (GitHub Pages, .github/workflows/pages.yml, is the primary deployment).
# main          -> development worker (bcr32-studio-dev), automatically after tests.
# release       -> production worker (bcr32-studio), after approval of the "production" environment.
# manual run    -> either target, same rules.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Worker to deploy
        type: choice
        options: [dev, production]
        default: dev

permissions:
  contents: read

jobs:
  dev:
    # Only on GitHub, only from the upstream repository (forks have no Cloudflare secrets).
    if: >-
      github.server_url == 'https://github.com' && github.repository == 'TheLazyGeekGuy/bcr32-studio' && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy-dev
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to the development worker
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        if: vars.DEV_URL != ''
        run: node scripts/smoke-test.mjs "$DEV_URL"
        env:
          DEV_URL: ${{ vars.DEV_URL }}

  production:
    if: >-
      github.server_url == 'https://github.com' && github.repository == 'TheLazyGeekGuy/bcr32-studio' && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy-production
    # Configure required reviewers on this environment (Settings > Environments > production): nothing reaches
    # production without the maintainer's approval.
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to the production worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        if: vars.PROD_URL != ''
        run: node scripts/smoke-test.mjs "$PROD_URL"
        env:
          PROD_URL: ${{ vars.PROD_URL }}
