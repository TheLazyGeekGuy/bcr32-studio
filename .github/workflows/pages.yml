name: Pages

# Production is explicit: a main push must never publish a development build.
# The maintainer chooses the immutable source revision for a release or rollback.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full approved source commit (40 hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.server_url == 'https://github.com' && github.repository == 'TheLazyGeekGuy/bcr32-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate immutable release source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - run: npm ci
      - run: npm test
      # Pages sends no custom headers: the CSP of public/_headers is injected as a <meta> tag (META_CSP=1).
      - run: npm run build
        env:
          META_CSP: '1'
      - name: Single-page fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
