name: Pages

# Primary public deployment: every push to main is built and published on GitHub Pages
# (https://thelazygeekguy.github.io/bcr32-studio/). No external service, no secret.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.server_url == 'https://github.com' && github.repository == 'TheLazyGeekGuy/bcr32-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - run: npm ci
      - run: npm test
      # Pages sends no custom headers: the CSP of public/_headers is injected as a <meta> tag (META_CSP=1).
      - run: npm run build
        env:
          META_CSP: '1'
      - name: Single-page fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
