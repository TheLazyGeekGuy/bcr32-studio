version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Packages that must move together arrive in one pull request (React and React DOM must share a version;
    # Vite and its React plugin have matching majors).
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
    ignore:
      # TypeScript 7 (native compiler) no longer ships the JavaScript API the test loader uses
      # (ts.transpileModule). Stay on 5.x until the loader is migrated.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
